<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eclipse Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            eclipse: {
              bg: '#0a0a0f',
              card: '#16161d',
              accent: '#a855f7',
              accentDark: '#7c3aed'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="bg-eclipse-bg text-white min-h-screen">
  <div id="app" class="max-w-md mx-auto min-h-screen relative">
    <!-- Main screen and other sections remain as previously restored -->
    <!-- Full content includes all detailed screens; About and Device info updated below -->

    <!-- About -->
    <div id="about-screen" class="hidden">
      <div class="flex items-center gap-4 p-4 border-b border-gray-800">
        <button onclick="showScreen('main')" class="text-eclipse-accent text-xl"><i class="fas fa-chevron-left"></i></button>
        <h1 class="text-xl font-semibold">About</h1>
      </div>
      <div class="p-4 space-y-2">
        <div class="settings-row py-4 border-b border-gray-800 cursor-pointer" onclick="showScreen('device-info')">Device info</div>
        <div class="settings-row py-4 border-b border-gray-800 cursor-pointer">Credits</div>
        <div class="settings-row py-4 cursor-pointer">Open source licenses</div>
        <div class="text-center mt-8">
          <img src="logo.jpg" alt="Logo" class="w-24 h-24 mx-auto object-contain">
          <p class="mt-4 text-sm text-gray-400">Eclipse OS • Version 1.2.3</p>
        </div>
      </div>
    </div>

    <!-- Device info -->
    <div id="device-info-screen" class="hidden">
      <div class="flex items-center gap-4 p-4 border-b border-gray-800">
        <button onclick="showScreen('about')" class="text-eclipse-accent text-xl"><i class="fas fa-chevron-left"></i></button>
        <h1 class="text-xl font-semibold">Device info</h1>
      </div>
      <div class="p-4 space-y-3 text-sm">
        <div class="flex justify-between py-2"><span class="text-gray-400">Device name</span><span>Eclipse ePhone</span></div>
        <div class="flex justify-between py-2"><span class="text-gray-400">Model</span><span>Eclipse ePhone</span></div>
        <div class="flex justify-between py-2"><span class="text-gray-400">OS</span><span>Eclipse OS</span></div>
        <div class="flex justify-between py-2"><span class="text-gray-400">Version</span><span>1.2.3</span></div>
        <div class="flex justify-between py-2"><span class="text-gray-400">Security patch</span><span>2026-10-01</span></div>
        <div class="flex justify-between py-2"><span class="text-gray-400">RAM</span><span>8 GB</span></div>
        <div class="flex justify-between py-2"><span class="text-gray-400">Processor</span><span>Eclipse Chip</span></div>
        <div class="flex justify-between py-2"><span class="text-gray-400">Build number</span><span>20261027</span></div>
        <p class="text-xs text-gray-500 mt-4 text-center">Tap build number 7 times for developer options.</p>
      </div>
    </div>
  </div>
</body>
</html>
